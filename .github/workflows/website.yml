name: Website accounts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  accounts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: animesoul_tests
          POSTGRES_USER: animesoul
          POSTGRES_PASSWORD: ephemeral_ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U animesoul -d animesoul_tests"
          --health-interval 5s --health-timeout 5s --health-retries 15
    defaults:
      run:
        working-directory: app
    env:
      ANIMESOUL_DATABASE_URL: postgresql+psycopg://animesoul:ephemeral_ci_password@localhost:5432/animesoul_tests
      ANIMESOUL_TEST_DATABASE_URL: postgresql+psycopg://animesoul:ephemeral_ci_password@localhost:5432/animesoul_tests
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements-website.txt ruff==0.16.5 pip-audit==2.10.1
      - run: python -m pip_audit -r backend/requirements-website.txt
      - run: python -m ruff check backend/app/website backend/migrations backend/website_tests
      - run: python -m alembic upgrade head
      - run: python -m unittest discover -s backend/website_tests -v
