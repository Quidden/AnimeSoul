name: quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: animesoul
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: animesoul_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U animesoul -d animesoul_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://animesoul:ci-test-only@127.0.0.1:5432/animesoul_test
      TEST_DATABASE_URL: postgresql://animesoul:ci-test-only@127.0.0.1:5432/animesoul_test
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm check
      - run: pnpm format:check
      - run: pnpm audit --audit-level high
