name: animesoul-next-dev
services:
  postgres:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: animesoul
      POSTGRES_DB: animesoul
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm setup}
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U animesoul -d animesoul"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    ports: ["127.0.0.1:6391:6379"]
    volumes: ["redis:/data"]
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres:
  redis:
