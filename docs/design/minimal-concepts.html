splay:grid;grid-template-columns:46px 1fr auto auto;gap:16px;align-items:center;border-bottom:1px solid #26272d;padding:12px 0}.episode.active{background:#b69bdd09}.number{font-size:18px;color:#9b91af}.episode.active .number{color:#d1b7ff}.ep-open{text-align:left;padding:0}.ep-open small{display:block;margin-top:3px}.episode select{font-size:12px;padding:6px}.watched{color:#c6b3e9}.section-tools{margin:16px 0}.details{padding:18px;background:#1e1e25;margin-top:10px;border-radius:6px}.details p{margin:6px 0;color:#a9a6b7}.B .header{gap:12px}.B .library{display:grid;grid-template-columns:185px 1fr;gap:32px}.B .library-nav{display:flex;flex-direction:column;border:0;gap:3px;align-self:start}.B .library-nav button{text-align:left;padding:10px 12px;border:0;border-radius:6px}.B .library-nav button[aria-pressed=true]{background:#28252f}.B .items{grid-template-columns:1fr;gap:0}.B .item{display:grid;grid-template-columns:85px 1fr;gap:18px;padding:17px 0;border-bottom:1px solid #292a2f}.B .art{height:95px;margin:0;font-size:20px}.B .item .track{max-width:220px}.B .season-layout{display:grid;grid-template-columns:165px 1fr;gap:28px}.B .seasons{display:flex;flex-direction:column;align-self:start}.B .seasons button{text-align:left}.B .episodes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 25px}.B .episode{grid-template-columns:26px 1fr auto;gap:8px}.B .episode select{grid-column:2/4;justify-self:start}.C .header{max-width:1100px;margin:auto}.C .main{max-width:1040px;margin:auto}.C .hero{background:none;padding:28px 0;border-bottom:1px solid #303036;border-radius:0}.C .hero-art{display:none}.C .library-nav{gap:8px;border:0}.C .library-nav button{padding:8px 13px;border:0;border-radius:30px}.C .library-nav button[aria-pressed=true]{background:#ddd5e9;color:#242029}.C .items{grid-template-columns:1fr}.C .item{display:grid;grid-template-columns:65px 1fr;gap:20px}.C .art{height:70px;font-size:17px}.C .item .track{display:none}.C .item .bar{float:right}.C .episode{grid-template-columns:35px 1fr auto auto}.accordion{border-bottom:1px solid #303037;margin-bottom:8px}.accordion>button{width:100%;text-align:left;padding:16px 0;font-size:16px}.phone .header nav{width:100%}.phone .header{gap:8px;padding:14px}.phone .search{order:4;max-width:none;flex-basis:100%}.phone .main{padding:25px 18px}.phone h1{font-size:29px}.phone .hero{padding:24px 18px}.phone .hero-art{display:none}.phone .items,.phone .library,.phone .season-layout,.phone .episodes{display:block}.phone .item{margin-bottom:24px}.phone .library-nav,.phone .seasons{flex-direction:row;gap:10px}.phone .episode{grid-template-columns:25px 1fr auto;gap:8px}.phone .episode select{grid-column:2/4;justify-self:start}.phone .season-info .bar{gap:6px}.phone .library-nav button{font-size:12px}.phone .C .item .bar{float:none}dialog{color:#eee;background:#202126;border:1px solid #44434a;border-radius:12px;max-width:500px;width:calc(100% - 32px);padding:25px}dialog::backdrop{background:#0009}dialog p{color:#b3b2bd;margin:15px 0}dialog button{background:#33313b;margin:4px}#toast{min-height:24px;color:#c9b8e7;padding:0 4vw;font-size:12px}a{color:inherit}@media(max-width:650px){.header{gap:8px}.header nav{width:100%;order:4}.search{max-width:200px}.hero{padding:24px}.hero-art{display:none}.items,.B .library,.B .season-layout,.B .episodes{display:block}.item{margin-bottom:25px}.B .library-nav,.B .seasons{flex-direction:row;gap:8px}.episode,.C .episode{grid-template-columns:26px 1fr auto;gap:8px}.episode select{grid-column:2/4;justify-self:start}.library-nav{gap:14px}h1{font-size:29px}.main{padding:25px 5%}.C .item .bar{float:none}}
.header{padding:14px 3%;gap:10px}.header nav button{padding-inline:8px}.header .search{max-width:200px}.header>button[data-modal=settings]{font-size:0;padding:9px}.header>button[data-modal=settings]::after{content:'⚙';font-size:20px}

<div class="studio"><div class="bar between"><div><div class="studio-title">ANIMESOUL / DESIGN STUDY</div><h2>Меньше шума. Больше аниме.</h2></div><div class="switch" id="variants"><button data-v="A">01 · Линия</button><button data-v="B">02 · Медиатека</button><button data-v="C">03 · Фокус</button></div></div><div class="bar between" style="margin-top:18px"><div class="switch"><button data-page="home">Главная</button><button data-page="anime">Страница аниме</button></div><div class="switch"><button data-size="desktop">Компьютер</button><button data-size="phone">Телефон</button></div></div><p id="description"></p><small>Интерактивный макет · демонстрационные данные · изменения не затрагивают вашу медиатеку</small></div>
<div id="toast" role="status" aria-live="polite"></div><div id="app" class="viewport"></div><dialog id="dialog"><div id="dialog-body"></div><button id="close">Закрыть</button></dialog>
<script>
const state={variant:'A',page:'home',size:'desktop',tab:0,season:1,episode:4,watched:new Set(['1:1','1:2','1:3']),scores:{},seasonScores:{},expanded:1,detail:null,removed:new Set(),folders:['Избранное','На выходные','Посмотреть позже'],deleted:null,history:true};
const titles=['Провожающая в последний путь Фрирен','Монолог фармацевта','Магическая битва'];
const descriptions={A:'Тонкая шапка, текстовые вкладки и спокойный список серий. Привычная структура, меньше рамок и повторов.',B:'Медиатека с боковым меню, сезоны в отдельной колонке и серии в две колонки. Быстрый доступ к большому списку.',C:'Короткая шапка с меню разделов, компактная медиатека и раскрывающиеся сезоны. Максимум свободного пространства.'};
const app=document.getElementById('app');const dialog=document.getElementById('dialog');
function btn(text,attrs=''){return `<button ${attrs}>${text}</button>`}function notify(s){document.getElementById('toast').textContent=s}function modal(title,body){document.getElementById('dialog-body').innerHTML=`<h2>${title}</h2>${body}`;dialog.showModal()}function score(key,season=false){const val=(season?state.seasonScores:state.scores)[key]||'';return `<select aria-label="${season?'Оценка сезона':'Оценка серии'} ${key}" data-score="${key}" ${season?'data-season-score':''}><option value="">☆ Оценка</option>${Array.from({length:10},(_,i)=>`<option ${val==i+1?'selected':''}>${i+1}</option>`).join('')}</select>`}
function header(){return `<header class="header">${btn('Anime<span>Soul</span>','class="brand" data-page="home"')}<nav aria-label="Разделы">${state.variant==='C'?btn('Разделы ⌄','data-modal="nav"'):['Каталог','Скачанные','Статистика','Оценки'].map(x=>btn(x,`data-nav="${x}"`)).join('')}${btn('К просмотру','data-page="anime"')}</nav><form class="search"><input aria-label="Поиск аниме или настройки" placeholder="Аниме или настройка…"></form>${btn('●','class="status" aria-label="Соединение и сохранения" data-modal="status"')}${btn('Настройки','data-modal="settings"')}</header>`}
function home(){const tabs=['Смотрю сейчас','Отслеживаю','Папки и избранное','История'];return `<section class="hero"><div><div class="eyebrow">ПРОДОЛЖИТЬ ПРОСМОТР</div><h1>Провожающая в последний<br>путь Фрирен</h1><p>Сезон 1 · серия 4 · остановились на 12:48</p>${btn('▶ Продолжить с 12:48','class="primary" data-page="anime"')}</div><div class="hero-art" aria-hidden="true">旅</div></section><div class="bar between"><h2>Моя медиатека</h2>${btn('3 новые серии ↗','data-tab="1"')}</div><div class="library"><nav class="library-nav" aria-label="Медиатека">${tabs.map((x,i)=>btn(`${x}<span class="count">${[3,3,state.folders.length,3][i]}</span>`,`data-tab="${i}" aria-pressed="${state.tab===i}"`)).join('')}</nav><div><div class="bar between section-tools"><small>${['По последнему просмотру','Подписки · обновлено только что','Личные подборки','Последние просмотры'][state.tab]}</small><div>${state.tab===2?btn('+ Создать папку','data-action="folder"')+(state.deleted?btn('↶ Восстановить','data-action="restore"'):''):state.tab===3?`<label><input type="checkbox" data-action="history" ${state.history?'checked':''}> Сохранять историю</label>${btn('Очистить','data-action="clear"')}`:btn('Открыть все ↗','data-action="all"')}</div></div><div class="items">${(state.tab===2?state.folders:titles).map((t,i)=>state.removed.has(state.tab+':'+t)?'':`<article class="item"><div class="art" aria-hidden="true">${state.tab===2?'▱':['旅','薬','呪'][i]}</div><div><h3>${btn(t,`data-open="${i}"`)}</h3><p>${state.tab===2?'Подборка · 8 тайтлов · 34 из 80 серий':state.tab===1?'Озвучка: AniLibria · '+(i===0?'3 новые серии':'Нет новых серий'):state.tab===3?'Сегодня · сезон 1, серия 4 · 12:48':'Сезон 1 · серия '+[4,8,12][i]+' · '+[12,7,18][i]+':48'}</p><div class="track"><i style="width:${[35,65,48][i%3]}%"></i></div><div class="bar between"><small>${state.tab===1?'Доступно 12 серий':`${[35,65,48][i%3]}% просмотрено`}</small><div>${btn(state.tab===1?'Отписаться':state.tab===2?'Удалить':'Убрать',`data-remove="${i}"`)}${btn(state.tab===1?'Смотреть новую':state.tab===2?'Открыть':'▶ Продолжить',`data-open="${i}"`)}</div></div></div></article>`).join('')}</div></div></div><details class="footer"><summary>Помощь и вопросы</summary><p>Сохранения, история, папки и отслеживание остаются доступны в соответствующих разделах.</p></details>`}
function episodes(s){return Array.from({length:6},(_,i)=>{const n=i+1,k=s+':'+n,w=state.watched.has(k);return `<div class="episode ${state.episode===n&&state.season===s?'active':''}"><span class="number">${String(n).padStart(2,'0')}</span><button class="ep-open" data-ep="${k}"><strong>Серия ${n} ${n===6?'· Новая':''}</strong><small>24 мин · ${w?'Просмотрено':n===4?'53% · 12:48':'Не просмотрено'}${n===2?' · ×2':''}</small></button>${btn(w?'✓':'○',`class="${w?'watched':''}" data-watch="${k}" aria-label="${w?'Снять отметку просмотра':'Отметить просмотренной'}: серия ${n}" aria-pressed="${w}"`)}${score(k)}${btn('Подробнее',`data-detail="${k}" style="grid-column:2/-1;justify-self:start;font-size:11px;padding:0;color:#9995a3"`)}</div>${state.detail===k?`<div class="details"><b>Серия ${n}</b><p>Выход: ${String(7+n).padStart(2,'0')}.09.2026 · AnimeSoul: 8.6 · Пересмотров: ${n===2?2:0}</p><p>Превью эпизода — демонстрационная область</p></div>`:''}`}).join('')}
function seasonContent(s){const count=[...state.watched].filter(x=>x.startsWith(s+':')).length;return `<div class="season-info"><div class="bar between"><div><h3>Сезон ${s}</h3><small>${count} из 6 просмотрено</small></div><div class="bar ratings"><span>AnimeSoul 8.8 · Серии 8.5 · Итог ${state.seasonScores[s]?((Number(state.seasonScores[s])+8.5)/2).toFixed(1):'8.5'}</span>${score(s,true)}${btn(count===6?'✓ Снять все':'Отметить весь сезон',`data-all-watch="${s}"`)}</div></div><div class="track"><i style="width:${count/6*100}%"></i></div></div><div class="episodes">${episodes(s)}</div>`}
function anime(){return `<div class="bar between"><div><small>Страница аниме</small><h2>Провожающая в последний путь Фрирен</h2></div>${btn('← Медиатека','data-page="home"')}</div><div class="player"><b>Область существующего плеера</b><p>Плеер остаётся без изменений</p><small id="now">Выбрано: сезон ${state.season} · серия ${state.episode}</small></div><div class="bar between"><h2>Сезоны и серии</h2><small>2 сезона · специальные выпуски</small></div>${state.variant==='C'?`<div class="season-layout">${[1,2,3].map(s=>`<section class="accordion">${btn(`${s===3?'Специальные выпуски':`Сезон ${s}`} <span class="muted">${s===3?'· Запланировано на 2027':'· 6 серий'}</span> <span style="float:right">${state.expanded===s?'−':'+'}</span>`,`data-expand="${s}" aria-expanded="${state.expanded===s}"`)}${state.expanded===s?(s===3?'<p class="muted">Видео пока не добавлено · дата выхода не указана</p>':seasonContent(s)):''}</section>`).join('')}</div>`:`<div class="season-layout"><nav class="seasons" aria-label="Сезоны">${[1,2,3].map(s=>btn(s===3?'Спецвыпуски':`Сезон ${s}`,`data-season="${s}" aria-pressed="${state.season===s}"`)).join('')}</nav><div>${state.season===3?'<p class="muted">Запланировано · 2027<br>Видео пока не добавлено</p>':seasonContent(state.season)}</div></div>`}`}
function render(){app.className=`viewport ${state.variant} ${state.size==='phone'?'phone':''}`;app.innerHTML=header()+`<main class="main">${state.page==='home'?home():anime()}<footer class="footer bar between"><span>AnimeSoul</span><span>Прогресс сохраняется на этом устройстве</span><span>Данные: YummyAnime / Kodik</span></footer></main>`;document.getElementById('description').textContent=descriptions[state.variant];document.querySelectorAll('[data-v]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===state.variant));document.querySelectorAll('.studio [data-page]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.page===state.page));document.querySelectorAll('[data-size]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.size===state.size))}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.v)state.variant=d.v;if(d.page)state.page=d.page;if(d.size)state.size=d.size;if(d.tab!==undefined)state.tab=Number(d.tab);if(d.season){state.season=Number(d.season);state.detail=null}if(d.expand)state.expanded=state.expanded===Number(d.expand)?null:Number(d.expand);if(d.ep){[state.season,state.episode]=d.ep.split(':').map(Number);notify(`Выбрано: сезон ${state.season}, серия ${state.episode}`)}if(d.watch){state.watched.has(d.watch)?state.watched.delete(d.watch):state.watched.add(d.watch)}if(d.detail)state.detail=state.detail===d.detail?null:d.detail;if(d.allWatch){const keys=Array.from({length:6},(_,i)=>d.allWatch+':'+(i+1));const all=keys.every(k=>state.watched.has(k));keys.forEach(k=>all?state.watched.delete(k):state.watched.add(k))}if(d.open!==undefined){if(state.tab===2)modal(state.folders[Number(d.open)],'<p>8 тайтлов · прогресс 42%</p>'+titles.map(t=>btn(t,'data-page="anime" data-dismiss')).join(''));else state.page='anime'}if(d.remove!==undefined){const i=Number(d.remove);if(state.tab===2){state.deleted=state.folders.splice(i,1)[0]}else state.removed.add(state.tab+':'+titles[i])}if(d.action==='folder')modal('Новая папка','<form id="folder-form"><p><input name="folder" aria-label="Название папки" placeholder="Название" required maxlength="60"></p><button>Создать</button></form>');if(d.action==='restore'){state.folders.push(state.deleted);state.deleted=null}if(d.action==='clear')titles.forEach(t=>state.removed.add('3:'+t));if(d.action==='all')modal('Вся коллекция',titles.map(t=>btn(t,'data-page="anime" data-dismiss')).join(''));if(d.modal==='nav')modal('Разделы',['Каталог','Скачанные','Статистика','Оценки'].map(t=>btn(t,`data-nav="${t}"`)).join(''));if(d.nav){if(dialog.open)dialog.close();modal(d.nav,'<p>В итоговом интерфейсе здесь откроется существующий раздел «'+d.nav+'».</p>')}if(d.modal==='status')modal('Соединение и сохранения','<p>● YummyAnime · 42 мс<br>● Kodik · 36 мс<br>● Сохранено на ПК · 21:08<br>● Комната · 54 мс</p>'+btn('Синхронизировать Google Drive','data-sync'));if(d.sync)notify('Демонстрация: запрошена синхронизация');if(d.modal==='settings')modal('Настройки','<p>Существующий центр настроек открывается отсюда. Профили, темы, плеер, совместный просмотр, импорт и экспорт сохраняются.</p><label>Профиль <select><option>Основной</option><option>Второй профиль</option></select></label>');if(b.id==='close'||'dismiss'in d)dialog.close();render()});
document.addEventListener('change',e=>{if(e.target.dataset.score){const d=e.target.dataset;(e.target.hasAttribute('data-season-score')?state.seasonScores:state.scores)[d.score]=e.target.value;render()}if(e.target.dataset.action==='history')state.history=e.target.checked});document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='folder-form'){const name=new FormData(e.target).get('folder').trim();if(name){state.folders.push(name);dialog.close();render()}}else if(e.target.classList.contains('search')){const q=e.target.querySelector('input').value.trim().toLowerCase();const found=titles.filter(x=>x.toLowerCase().includes(q));modal('Поиск',found.length?found.map(x=>btn(x,'data-page="anime" data-dismiss')).join(''):'<p>Ничего не найдено. В приложении поиск также находит настройки.</p>')}});render();
